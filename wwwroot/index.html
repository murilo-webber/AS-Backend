<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Águas - CRUD</title>
  <style>
    :root {
      --bg: #0b1a24;
      --card: #12293a;
      --accent: #3aa6c1;
      --accent-hover: #55bdd6;
      --text: #e3f4fa;
      --muted: #84a8b8;
      --danger: #c45c4a;
      --success: #6bb58a;
      --border: #1d3d52;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 {
      text-align: center;
      margin-bottom: 0.25rem;
      font-size: 1.8rem;
      color: var(--accent);
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    h2 { font-size: 1.15rem; margin-bottom: 1rem; color: var(--accent); }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      align-items: end;
    }
    @media (max-width: 700px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      padding: 0.65rem 1.2rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--accent); color: #0b1a24; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { opacity: 0.9; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-secondary:hover { background: #28506a; }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.75rem 0.6rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-size: 0.8rem; font-weight: 600; }
    tr:hover td { background: rgba(58, 166, 193, 0.08); }
    .actions { display: flex; gap: 0.4rem; }
    .actions button { padding: 0.35rem 0.7rem; font-size: 0.8rem; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
    }
    .msg {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }
    .msg.ok { background: rgba(107, 181, 138, 0.2); color: var(--success); display: block; }
    .msg.err { background: rgba(196, 92, 74, 0.2); color: var(--danger); display: block; }
    #editId { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💧 API de Águas</h1>
    <p class="subtitle">CRUD com Entity Framework Core + SQLite</p>

    <div id="msg" class="msg"></div>

    <div class="card">
      <h2 id="formTitle">Cadastrar água</h2>
      <form id="form" class="form-grid">
        <input type="hidden" id="editId">
        <div>
          <label for="titulo">Título</label>
          <input type="text" id="titulo" required placeholder="Ex: Água mineral sem gás">
        </div>
        <div style="display:flex;gap:0.5rem;">
          <button type="submit" class="btn-primary" id="btnSubmit">Salvar</button>
          <button type="button" class="btn-secondary" id="btnCancel" style="display:none;">Cancelar</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Lista de águas</h2>
      <div id="lista">
        <p class="empty">Carregando...</p>
      </div>
    </div>
  </div>

  <script>
    const API = '/api/aguas';
    let aguas = [];

    // Escapa texto vindo da API antes de colocá-lo no HTML
    function esc(texto) {
      return String(texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showMsg(text, ok = true) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + (ok ? 'ok' : 'err');
      setTimeout(() => el.className = 'msg', 3000);
    }

    async function carregar() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error('Falha ao listar');
        aguas = await res.json();
        const container = document.getElementById('lista');
        if (!aguas.length) {
          container.innerHTML = '<p class="empty">Nenhuma água cadastrada.</p>';
          return;
        }
        container.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              ${aguas.map(a => `
                <tr>
                  <td>${a.id}</td>
                  <td>${esc(a.titulo)}</td>
                  <td class="actions">
                    <button class="btn-secondary" data-acao="editar" data-id="${a.id}">Editar</button>
                    <button class="btn-danger" data-acao="excluir" data-id="${a.id}">Excluir</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (e) {
        document.getElementById('lista').innerHTML = '<p class="empty">Erro ao carregar.</p>';
        showMsg('Falha ao listar águas', false);
      }
    }

    document.getElementById('lista').addEventListener('click', (e) => {
      const botao = e.target.closest('button[data-acao]');
      if (!botao) return;
      const id = Number(botao.dataset.id);
      if (botao.dataset.acao === 'editar') {
        editar(aguas.find(a => a.id === id));
      } else {
        excluir(id);
      }
    });

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const body = {
        titulo: document.getElementById('titulo').value.trim()
      };

      try {
        let res;
        if (id) {
          res = await fetch(`${API}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        } else {
          res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
        }

        if (!res.ok) throw new Error('Falha na operação');
        showMsg(id ? 'Água atualizada!' : 'Água cadastrada!');
        cancelEdit();
        carregar();
      } catch {
        showMsg('Erro ao salvar', false);
      }
    });

    function editar(a) {
      if (!a) return;
      document.getElementById('editId').value = a.id;
      document.getElementById('titulo').value = a.titulo;
      document.getElementById('formTitle').textContent = 'Editar água #' + a.id;
      document.getElementById('btnSubmit').textContent = 'Atualizar';
      document.getElementById('btnCancel').style.display = 'inline-block';
    }

    function cancelEdit() {
      document.getElementById('editId').value = '';
      document.getElementById('form').reset();
      document.getElementById('formTitle').textContent = 'Cadastrar água';
      document.getElementById('btnSubmit').textContent = 'Salvar';
      document.getElementById('btnCancel').style.display = 'none';
    }

    document.getElementById('btnCancel').addEventListener('click', cancelEdit);

    async function excluir(id) {
      if (!confirm('Excluir esta água?')) return;
      try {
        const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
        if (res.status === 204 || res.ok) {
          showMsg('Água excluída');
          carregar();
        } else {
          showMsg('Erro ao excluir', false);
        }
      } catch {
        showMsg('Erro ao excluir', false);
      }
    }

    carregar();
  </script>
</body>
</html>
